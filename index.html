<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenStreetMap WKT Playground</title>

  <!-- OpenLayers CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.3.0/ol.css" />
  <script src="https://cdn.jsdelivr.net/npm/ol@v7.3.0/dist/ol.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Helper Libraries for Screenshots & Word Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.2.3/build/index.umd.js"></script>
  <script>
    if (typeof window.docx === 'undefined') {
      document.write('<script src="https://unpkg.com/docx@8.2.3/build/index.umd.js"><\/script>');
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
    .layout { display: flex; height: 100vh; position: relative; overflow: hidden; }
    
    .sidebar { 
      width: 340px; 
      min-width: 340px;
      background: #f8fafc; 
      border-right: 1px solid #cbd5e1; 
      padding: 16px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      transition: margin-left 0.3s ease;
      z-index: 10;
    }
    .sidebar.collapsed { margin-left: -340px; }

    .toggle-btn {
      position: absolute;
      top: 80px; 
      left: 348px;
      z-index: 20;
      width: 32px;
      height: 32px;
      background: #1e293b;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: left 0.3s ease;
    }
    .sidebar.collapsed + .toggle-btn { left: 8px; }

    .map-container { flex: 1; height: 100%; width: 100%; }
    label { font-size: 12px; font-weight: bold; }
    input, textarea, button { width: 100%; padding: 8px; margin-top: 4px; border-radius: 4px; border: 1px solid #cbd5e1; }
    textarea { font-family: monospace; resize: vertical; }
    button { cursor: pointer; border: none; font-weight: bold; color: white; background: #3b82f6; }
    button:hover { opacity: 0.9; }
    .btn-row { display: flex; gap: 8px; }
    .btn-draw { background: #10b981; }
    .btn-draw.active { background: #ef4444; }
    .btn-save { background: #6366f1; }
    .btn-share { background: #8b5cf6; }
    .btn-export { background: #059669; }
    .btn-new { background: #64748b; width: auto; padding: 0 12px; white-space: nowrap; }
    
    .saved-card { background: white; border: 1px solid #cbd5e1; padding: 10px; border-radius: 4px; }
    .saved-card.active-card { border-color: #6366f1; background: #f0f3ff; }
    .saved-wkt { font-family: monospace; font-size: 11px; color: #64748b; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; margin: 4px 0 8px; }
    .card-actions { display: flex; gap: 6px; }
    .btn-sm { padding: 4px 8px; font-size: 12px; }
    .btn-del { background: #ef4444; }
    .btn-load { background: #3b82f6; }
    
    .search-box { display: flex; gap: 6px; }
    .search-box input { margin-top: 0; }
    .search-box button { width: auto; margin-top: 0; padding: 0 12px; background: #0284c7; }

    /* Login Screen Overlay Styles */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .user-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e2e8f0;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
    }
    .btn-logout {
      background: #ef4444;
      padding: 4px 8px;
      font-size: 11px;
      width: auto;
    }
  </style>
</head>
<body>

<!-- Login Modal -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <h3 style="margin-top:0; margin-bottom:12px;">Restricted Access</h3>
    <p style="font-size:12px; color:#64748b; margin-bottom:16px;">Sign in with an authorized account to use WKT Playground.</p>
    
    <label>Email Address</label>
    <input type="email" id="loginEmail" placeholder="user@example.com" />
    
    <label style="margin-top:8px; display:block;">Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter') handleLogin()" />
    
    <button style="margin-top:16px;" onclick="handleLogin()">Sign In</button>
  </div>
</div>

<div class="layout" id="mainApp" style="display:none;">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="user-banner">
      <span id="userEmailSpan" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px;">User</span>
      <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
    </div>

    <h2 style="margin:0; font-size: 18px;">WKT Playground</h2>

    <div>
      <label>Search Location</label>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="City, street, landmark..." onkeydown="if(event.key==='Enter') searchAddress()" />
        <button onclick="searchAddress()">🔍</button>
      </div>
    </div>

    <div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <label>Shape Label</label>
        <button class="btn-new btn-sm" onclick="clearActiveSelection()">➕ New</button>
      </div>
      <input type="text" id="shapeLabel" placeholder="e.g. Downtown District" />
    </div>

    <div>
      <label>WKT Text</label>
      <textarea id="wktInput" rows="5" placeholder="POLYGON((...))"></textarea>
    </div>

    <div class="btn-row">
      <button onclick="plotWKTFromInput()">Plot Shape</button>
      <button id="drawBtn" class="btn-draw" onclick="toggleDraw()">✏️ Draw Polygon</button>
    </div>

    <div class="btn-row">
      <button id="saveBtn" class="btn-save" onclick="saveCurrentShape()">💾 Save to Cloud</button>
      <button class="btn-share" onclick="copyShareableLink()">🔗 Share Link</button>
    </div>

    <button class="btn-export" id="exportBtn" onclick="exportToWord()">📄 Export Word Document</button>

    <hr style="width:100%; border:0; border-top: 1px solid #cbd5e1; margin: 4px 0;" />

    <label>Shared Cloud Shapes</label>
    <div id="savedList" style="display:flex; flex-direction:column; gap:8px;"></div>
  </aside>

  <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()" title="Toggle Sidebar">«</button>
  <div id="map" class="map-container"></div>
</div>

<script>
  // -------------------------------------------------------------
  // SUPABASE CONFIGURATION - Replace with your keys from Supabase
  // -------------------------------------------------------------
  const SUPABASE_URL = 'https://jknraumaovbguwphixle.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImprbnJhdW1hb3ZiZ3V3cGhpeGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0ODY2MDMsImV4cCI6MjEwNjA2MjYwM30.jhLr-2Pz5Mf2galJUP9zeuxyJuLHVgzJRc5k8Ai13As';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let activeEditingId = null;
  let cachedShapes = [];

  // Authentication Handlers
  async function initAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      showApp(session.user);
    } else {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
    }
  }

  async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    if (!email || !password) {
      alert('Please enter both email and password.');
      return;
    }

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      alert('Login failed: ' + error.message);
    } else {
      showApp(data.user);
    }
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
    location.reload();
  }

  function showApp(user) {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainApp').style.display = 'flex';
    document.getElementById('userEmailSpan').innerText = user.email;
    map.updateSize();
    fetchCloudShapes();
    subscribeToCloudChanges();
  }

  // Map Setup
  const defaultStyle = new ol.style.Style({
    fill: new ol.style.Fill({ color: 'rgba(6, 182, 212, 0.4)' }),
    stroke: new ol.style.Stroke({ color: '#0284c7', width: 3 }),
    image: new ol.style.Circle({
      radius: 6,
      fill: new ol.style.Fill({ color: '#2563eb' }),
      stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
    })
  });

  const wktFormat = new ol.format.WKT();
  const vectorSource = new ol.source.Vector();
  const vectorLayer = new ol.layer.Vector({ source: vectorSource, style: defaultStyle });

  const map = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({ source: new ol.source.OSM({ crossOrigin: 'anonymous' }) }),
      vectorLayer
    ],
    view: new ol.View({ center: ol.proj.fromLonLat([0, 0]), zoom: 2 })
  });

  const modify = new ol.interaction.Modify({ 
    source: vectorSource,
    style: new ol.style.Style({
      image: new ol.style.Circle({
        radius: 8,
        fill: new ol.style.Fill({ color: '#ef4444' }),
        stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
      })
    })
  });
  map.addInteraction(modify);

  modify.on('modifyend', function () {
    const features = vectorSource.getFeatures();
    if (features.length > 0) {
      const updatedWkt = wktFormat.writeFeature(features[0], {
        dataProjection: 'EPSG:4326',
        featureProjection: 'EPSG:3857'
      });
      document.getElementById('wktInput').value = updatedWkt;
    }
  });

  // Supabase Database Operations
  async function fetchCloudShapes() {
    const { data, error } = await supabaseClient.from('shapes').select('*');
    if (error) {
      console.error('Error loading cloud shapes:', error);
      return;
    }
    cachedShapes = data || [];
    renderSavedList();
  }

  function subscribeToCloudChanges() {
    supabaseClient
      .channel('public:shapes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'shapes' }, () => {
        fetchCloudShapes();
      })
      .subscribe();
  }

  async function saveCurrentShape() {
    const wkt = document.getElementById('wktInput').value.trim();
    const label = document.getElementById('shapeLabel').value.trim();
    if (!wkt) return;

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;

    if (activeEditingId) {
      const { error } = await supabaseClient
        .from('shapes')
        .update({ label: label || 'Untitled Shape', wkt: wkt })
        .eq('id', activeEditingId);
      if (error) alert('Error updating shape: ' + error.message);
    } else {
      const { error } = await supabaseClient
        .from('shapes')
        .insert([{ label: label || 'Untitled Shape', wkt: wkt }]);
      if (error) alert('Error saving shape: ' + error.message);
    }

    saveBtn.disabled = false;
    await fetchCloudShapes();
  }

  async function deleteShape(id) {
    if (String(activeEditingId) === String(id)) clearActiveSelection();
    const { error } = await supabaseClient.from('shapes').delete().eq('id', id);
    if (error) alert('Error deleting shape: ' + error.message);
    await fetchCloudShapes();
  }

  function renderSavedList() {
    const list = document.getElementById('savedList');
    list.innerHTML = '';

    if (cachedShapes.length === 0) {
      list.innerHTML = '<span style="font-size:12px; color:#64748b;">No shared cloud shapes.</span>';
      return;
    }

    cachedShapes.forEach(item => {
      const card = document.createElement('div');
      const isActive = String(item.id) === String(activeEditingId);
      card.className = `saved-card ${isActive ? 'active-card' : ''}`;
      
      card.innerHTML = `
        <div style="font-weight:bold; font-size:13px;">
          ${escapeHtml(item.label)} ${isActive ? '<span style="font-size:10px; color:#6366f1;">(Editing)</span>' : ''}
        </div>
        <div class="saved-wkt">${escapeHtml(item.wkt)}</div>
        <div class="card-actions">
          <button class="btn-sm btn-load" data-id="${item.id}">Load & Edit</button>
          <button class="btn-sm btn-del" data-id="${item.id}">Delete</button>
        </div>
      `;

      card.querySelector('.btn-load').addEventListener('click', (e) => {
        const id = e.target.getAttribute('data-id');
        loadShape(id);
      });

      card.querySelector('.btn-del').addEventListener('click', (e) => {
        const id = e.target.getAttribute('data-id');
        deleteShape(id);
      });

      list.appendChild(card);
    });
  }

  function loadShape(id) {
    const target = cachedShapes.find(s => String(s.id) === String(id));
    if (target) {
      activeEditingId = target.id;
      document.getElementById('wktInput').value = target.wkt;
      document.getElementById('shapeLabel').value = target.label;
      document.getElementById('saveBtn').innerText = '🔄 Update Cloud Shape';
      plotWKTFromInput();
      renderSavedList();
    }
  }

  function clearActiveSelection() {
    activeEditingId = null;
    document.getElementById('wktInput').value = '';
    document.getElementById('shapeLabel').value = '';
    document.getElementById('saveBtn').innerText = '💾 Save to Cloud';
    vectorSource.clear();
    renderSavedList();
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function copyShareableLink() {
    const wkt = document.getElementById('wktInput').value.trim();
    const label = document.getElementById('shapeLabel').value.trim() || 'Shared Shape';
    if (!wkt) { alert('Plot or draw a shape before generating a share link.'); return; }

    const shareUrl = `${window.location.origin}${window.location.pathname}#wkt=${encodeURIComponent(wkt)}&label=${encodeURIComponent(label)}`;
    navigator.clipboard.writeText(shareUrl).then(() => {
      alert('Shareable link copied to clipboard!');
    }).catch(() => {
      prompt('Copy this shareable link:', shareUrl);
    });
  }

  async function searchAddress() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;
    try {
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
      const results = await response.json();
      if (results && results.length > 0) {
        map.getView().animate({
          center: ol.proj.fromLonLat([parseFloat(results[0].lon), parseFloat(results[0].lat)]),
          zoom: 14,
          duration: 800
        });
      } else { alert('Location not found.'); }
    } catch (err) { alert('Search failed.'); }
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggleBtn');
    sidebar.classList.toggle('collapsed');
    toggleBtn.innerText = sidebar.classList.contains('collapsed') ? '»' : '«';
    setTimeout(() => { map.updateSize(); }, 300);
  }

  let drawInteraction = null;
  function toggleDraw() {
    const drawBtn = document.getElementById('drawBtn');
    if (drawInteraction) {
      map.removeInteraction(drawInteraction);
      drawInteraction = null;
      drawBtn.innerText = '✏️ Draw Polygon';
      drawBtn.classList.remove('active');
    } else {
      vectorSource.clear();
      drawInteraction = new ol.interaction.Draw({ source: vectorSource, type: 'Polygon', style: defaultStyle });
      drawInteraction.on('drawend', function (e) {
        const wkt = wktFormat.writeFeature(e.feature, {
          dataProjection: 'EPSG:4326',
          featureProjection: 'EPSG:3857'
        });
        document.getElementById('wktInput').value = wkt;
        toggleDraw();
      });
      map.addInteraction(drawInteraction);
      drawBtn.innerText = 'Cancel Drawing';
      drawBtn.classList.add('active');
    }
  }

  function plotWKTFromInput() {
    const wkt = document.getElementById('wktInput').value.trim();
    if (!wkt) return;
    try {
      vectorSource.clear();
      const feature = wktFormat.readFeature(wkt, {
        dataProjection: 'EPSG:4326',
        featureProjection: 'EPSG:3857'
      });
      vectorSource.addFeature(feature);
      map.getView().fit(feature.getGeometry().getExtent(), { padding: [50, 50, 50, 50] });
    } catch (e) { alert('Invalid WKT geometry format.'); }
  }

  async function exportToWord() {
    const wkt = document.getElementById('wktInput').value.trim();
    const label = document.getElementById('shapeLabel').value.trim() || 'Untitled Shape';
    if (!wkt) { alert('Please plot or draw a shape before exporting.'); return; }
    const btn = document.getElementById('exportBtn');
    btn.innerText = 'Generating Word Doc...';
    btn.disabled = true;

    try {
      const canvas = await html2canvas(document.getElementById('map'), { useCORS: true, allowTaint: false, logging: false });
      
      const maxDocWidth = 550;
      const aspectRatio = canvas.height / canvas.width;
      const calcHeight = Math.round(maxDocWidth * aspectRatio);

      const imgBuffer = await fetch(canvas.toDataURL('image/png')).then((res) => res.arrayBuffer());
      const docxLib = window.docx;
      if (!docxLib || !docxLib.Document) throw new Error('docx library unavailable.');

      const { Document, Paragraph, TextRun, ImageRun, Table, TableRow, TableCell, WidthType } = docxLib;
      const doc = new Document({
        sections: [{
          children: [
            new Paragraph({ children: [new TextRun({ text: 'WKT Shape Export Report', bold: true, size: 32, font: 'Arial' })], spacing: { after: 100 } }),
            new Paragraph({ children: [new TextRun({ text: `Generated: ${new Date().toLocaleString()}`, size: 18, color: '6B7280', font: 'Arial' })], spacing: { after: 300 } }),
            new Paragraph({ children: [new TextRun({ text: '1. Map Visualization', bold: true, size: 24, font: 'Arial' })], spacing: { before: 200, after: 150 } }),
            new Paragraph({ children: [new ImageRun({ data: imgBuffer, transformation: { width: maxDocWidth, height: calcHeight } })], spacing: { after: 300 } }),
            new Paragraph({ children: [new TextRun({ text: '2. Geometry Details', bold: true, size: 24, font: 'Arial' })], spacing: { before: 200, after: 150 } }),
            new Table({
              width: { size: 100, type: WidthType.PERCENTAGE },
              rows: [
                new TableRow({ children: [
                  new TableCell({ width: { size: 25, type: WidthType.PERCENTAGE }, children: [new Paragraph({ children: [new TextRun({ text: 'Label:', bold: true, font: 'Arial' })] })] }),
                  new TableCell({ width: { size: 75, type: WidthType.PERCENTAGE }, children: [new Paragraph({ children: [new TextRun({ text: label, font: 'Arial' })] })] })
                ] }),
                new TableRow({ children: [
                  new TableCell({ width: { size: 25, type: WidthType.PERCENTAGE }, children: [new Paragraph({ children: [new TextRun({ text: 'WKT String:', bold: true, font: 'Arial' })] })] }),
                  new TableCell({ width: { size: 75, type: WidthType.PERCENTAGE }, children: [new Paragraph({ children: [new TextRun({ text: wkt, font: 'Courier New', size: 18, color: '1E3A8A' })] })] })
                ] })
              ]
            })
          ]
        }]
      });

      const blob = await docxLib.Packer.toBlob(doc);
      saveAs(blob, `${label.toLowerCase().replace(/\s+/g, '-')}.docx`);
    } catch (err) {
      alert('Export failed: ' + err.message);
    } finally {
      btn.innerText = '📄 Export Word Document';
      btn.disabled = false;
    }
  }

  // Initialize Auth Check
  initAuth();
</script>
</body>
</html>
