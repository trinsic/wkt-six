<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenStreetMap WKT Playground</title>

  <!-- OpenLayers CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.3.0/ol.css" />
  <script src="https://cdn.jsdelivr.net/npm/ol@v7.3.0/dist/ol.js"></script>

  <!-- Helper Libraries for Screenshots & Word Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- Robust docx library bundles -->
  <script src="https://cdn.jsdelivr.net/npm/docx@8.2.3/build/index.umd.js"></script>
  <script>
    if (typeof window.docx === 'undefined') {
      document.write('<script src="https://unpkg.com/docx@8.2.3/build/index.umd.js"><\/script>');
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
    .layout { display: flex; height: 100vh; position: relative; overflow: hidden; }
    
    /* Collapsible Sidebar Styles */
    .sidebar { 
      width: 340px; 
      min-width: 340px;
      background: #f8fafc; 
      border-right: 1px solid #cbd5e1; 
      padding: 16px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      transition: margin-left 0.3s ease;
      z-index: 10;
    }
    .sidebar.collapsed {
      margin-left: -340px;
    }

    /* Toggle Button Positioned Below Map Zoom Controls */
    .toggle-btn {
      position: absolute;
      top: 80px; 
      left: 348px;
      z-index: 20;
      width: 32px;
      height: 32px;
      background: #1e293b;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: left 0.3s ease;
    }
    .sidebar.collapsed + .toggle-btn {
      left: 8px;
    }

    .map-container { flex: 1; height: 100%; width: 100%; }
    label { font-size: 12px; font-weight: bold; }
    input, textarea, button { width: 100%; padding: 8px; margin-top: 4px; border-radius: 4px; border: 1px solid #cbd5e1; }
    textarea { font-family: monospace; resize: vertical; }
    button { cursor: pointer; border: none; font-weight: bold; color: white; background: #3b82f6; }
    button:hover { opacity: 0.9; }
    .btn-row { display: flex; gap: 8px; }
    .btn-draw { background: #10b981; }
    .btn-draw.active { background: #ef4444; }
    .btn-save { background: #6366f1; }
    .btn-export { background: #059669; }
    .btn-new { background: #64748b; width: auto; padding: 0 12px; white-space: nowrap; }
    
    .saved-card { background: white; border: 1px solid #cbd5e1; padding: 10px; border-radius: 4px; }
    .saved-card.active-card { border-color: #6366f1; background: #f0f3ff; }
    .saved-wkt { font-family: monospace; font-size: 11px; color: #64748b; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; margin: 4px 0 8px; }
    .card-actions { display: flex; gap: 6px; }
    .btn-sm { padding: 4px 8px; font-size: 12px; }
    .btn-del { background: #ef4444; }
    .btn-load { background: #3b82f6; }
    
    /* Search Box */
    .search-box { display: flex; gap: 6px; }
    .search-box input { margin-top: 0; }
    .search-box button { width: auto; margin-top: 0; padding: 0 12px; background: #0284c7; }
  </style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <h2 style="margin:0; font-size: 18px;">WKT Playground</h2>

    <!-- Address Search Section -->
    <div>
      <label>Search Location</label>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="City, street, landmark..." onkeydown="if(event.key==='Enter') searchAddress()" />
        <button onclick="searchAddress()">🔍</button>
      </div>
    </div>

    <div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <label>Shape Label</label>
        <button class="btn-new btn-sm" onclick="clearActiveSelection()" title="Clear active shape selection to create a new entry">➕ New</button>
      </div>
      <input type="text" id="shapeLabel" placeholder="e.g. Downtown District" />
    </div>

    <div>
      <label>WKT Text</label>
      <textarea id="wktInput" rows="5" placeholder="POLYGON((...))"></textarea>
    </div>

    <div class="btn-row">
      <button onclick="plotWKTFromInput()">Plot Shape</button>
      <button id="drawBtn" class="btn-draw" onclick="toggleDraw()">✏️ Draw Polygon</button>
    </div>

    <button id="saveBtn" class="btn-save" onclick="saveCurrentShape()">💾 Save Shape</button>
    <button class="btn-export" id="exportBtn" onclick="exportToWord()">📄 Export Word Document</button>

    <hr style="width:100%; border:0; border-top: 1px solid #cbd5e1; margin: 4px 0;" />

    <label>Saved Shapes</label>
    <div id="savedList" style="display:flex; flex-direction:column; gap:8px;"></div>
  </aside>

  <!-- Sidebar Collapse Toggle Button -->
  <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()" title="Toggle Sidebar">«</button>

  <!-- Map Container -->
  <div id="map" class="map-container"></div>
</div>

<script>
  let activeEditingId = null; // Tracks current saved shape ID for updating/overwriting

  // High-Contrast Vector Styling
  const defaultStyle = new ol.style.Style({
    fill: new ol.style.Fill({
      color: 'rgba(6, 182, 212, 0.4)'
    }),
    stroke: new ol.style.Stroke({
      color: '#0284c7',
      width: 3
    }),
    image: new ol.style.Circle({
      radius: 6,
      fill: new ol.style.Fill({ color: '#2563eb' }),
      stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
    })
  });

  // OpenLayers Setup
  const wktFormat = new ol.format.WKT();
  const vectorSource = new ol.source.Vector();
  const vectorLayer = new ol.layer.Vector({ 
    source: vectorSource,
    style: defaultStyle
  });

  const map = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({
        source: new ol.source.OSM({ crossOrigin: 'anonymous' })
      }),
      vectorLayer
    ],
    view: new ol.View({
      center: ol.proj.fromLonLat([0, 0]),
      zoom: 2
    })
  });

  // Modify Interaction for Dynamic Vertex Editing
  const modify = new ol.interaction.Modify({ 
    source: vectorSource,
    style: new ol.style.Style({
      image: new ol.style.Circle({
        radius: 8,
        fill: new ol.style.Fill({ color: '#ef4444' }),
        stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
      })
    })
  });
  map.addInteraction(modify);

  modify.on('modifyend', function () {
    const features = vectorSource.getFeatures();
    if (features.length > 0) {
      const updatedWkt = wktFormat.writeFeature(features[0], {
        dataProjection: 'EPSG:4326',
        featureProjection: 'EPSG:3857'
      });
      document.getElementById('wktInput').value = updatedWkt;
    }
  });

  // Address Geocoding via Nominatim
  async function searchAddress() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;

    try {
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
      const results = await response.json();

      if (results && results.length > 0) {
        const topResult = results[0];
        const lon = parseFloat(topResult.lon);
        const lat = parseFloat(topResult.lat);
        
        map.getView().animate({
          center: ol.proj.fromLonLat([lon, lat]),
          zoom: 14,
          duration: 800
        });
      } else {
        alert('Address or location not found.');
      }
    } catch (err) {
      alert('Error searching for address.');
    }
  }

  // Sidebar Collapse Function
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggleBtn');
    
    sidebar.classList.toggle('collapsed');
    toggleBtn.innerText = sidebar.classList.contains('collapsed') ? '»' : '«';
    
    setTimeout(() => { map.updateSize(); }, 300);
  }

  // Draw Functionality
  let drawInteraction = null;
  function toggleDraw() {
    const drawBtn = document.getElementById('drawBtn');
    if (drawInteraction) {
      map.removeInteraction(drawInteraction);
      drawInteraction = null;
      drawBtn.innerText = '✏️ Draw Polygon';
      drawBtn.classList.remove('active');
    } else {
      vectorSource.clear();
      drawInteraction = new ol.interaction.Draw({
        source: vectorSource,
        type: 'Polygon',
        style: defaultStyle
      });
      
      drawInteraction.on('drawend', function (e) {
        const wkt = wktFormat.writeFeature(e.feature, {
          dataProjection: 'EPSG:4326',
          featureProjection: 'EPSG:3857'
        });
        document.getElementById('wktInput').value = wkt;
        toggleDraw();
      });

      map.addInteraction(drawInteraction);
      drawBtn.innerText = 'Cancel Drawing';
      drawBtn.classList.add('active');
    }
  }

  // WKT Rendering
  function plotWKTFromInput() {
    const wkt = document.getElementById('wktInput').value.trim();
    if (!wkt) return;
    try {
      vectorSource.clear();
      const feature = wktFormat.readFeature(wkt, {
        dataProjection: 'EPSG:4326',
        featureProjection: 'EPSG:3857'
      });
      vectorSource.addFeature(feature);
      map.getView().fit(feature.getGeometry().getExtent(), { padding: [50, 50, 50, 50] });
    } catch (e) {
      alert('Invalid WKT geometry format.');
    }
  }

  // LocalStorage & Save / Update Management
  function getSavedShapes() {
    return JSON.parse(localStorage.getItem('saved_wkt_shapes') || '[]');
  }

  function renderSavedList() {
    const list = document.getElementById('savedList');
    const shapes = getSavedShapes();
    list.innerHTML = '';

    if (shapes.length === 0) {
      list.innerHTML = '<span style="font-size:12px; color:#64748b;">No saved shapes.</span>';
      return;
    }

    shapes.forEach(item => {
      const card = document.createElement('div');
      const isActive = item.id === activeEditingId;
      card.className = `saved-card ${isActive ? 'active-card' : ''}`;
      card.innerHTML = `
        <div style="font-weight:bold; font-size:13px;">${item.label} ${isActive ? '<span style="font-size:10px; color:#6366f1;">(Editing)</span>' : ''}</div>
        <div class="saved-wkt">${item.wkt}</div>
        <div class="card-actions">
          <button class="btn-sm btn-load" onclick="loadShape(${item.id})">Load & Edit</button>
          <button class="btn-sm btn-del" onclick="deleteShape(${item.id})">Delete</button>
        </div>
      `;
      list.appendChild(card);
    });
  }

  function saveCurrentShape() {
    const wkt = document.getElementById('wktInput').value.trim();
    const label = document.getElementById('shapeLabel').value.trim();
    if (!wkt) return;

    let shapes = getSavedShapes();

    if (activeEditingId) {
      // Update existing saved shape
      shapes = shapes.map(s => {
        if (s.id === activeEditingId) {
          return { ...s, label: label || s.label, wkt: wkt };
        }
        return s;
      });
    } else {
      // Save new shape entry
      shapes.push({
        id: Date.now(),
        label: label || `Shape ${shapes.length + 1}`,
        wkt: wkt
      });
    }

    localStorage.setItem('saved_wkt_shapes', JSON.stringify(shapes));
    renderSavedList();
  }

  function loadShape(id) {
    const shapes = getSavedShapes();
    const target = shapes.find(s => s.id === id);
    if (target) {
      activeEditingId = target.id;
      document.getElementById('wktInput').value = target.wkt;
      document.getElementById('shapeLabel').value = target.label;
      document.getElementById('saveBtn').innerText = '🔄 Update Saved Shape';
      plotWKTFromInput();
      renderSavedList();
    }
  }

  function clearActiveSelection() {
    activeEditingId = null;
    document.getElementById('wktInput').value = '';
    document.getElementById('shapeLabel').value = '';
    document.getElementById('saveBtn').innerText = '💾 Save Shape';
    vectorSource.clear();
    renderSavedList();
  }

  function deleteShape(id) {
    if (activeEditingId === id) {
      clearActiveSelection();
    }
    const shapes = getSavedShapes().filter(s => s.id !== id);
    localStorage.setItem('saved_wkt_shapes', JSON.stringify(shapes));
    renderSavedList();
  }

  // Word Document (.docx) Exporter with Robust Global Resolution
  async function exportToWord() {
    const wkt = document.getElementById('wktInput').value.trim();
    const label = document.getElementById('shapeLabel').value.trim() || 'Untitled Shape';

    if (!wkt) {
      alert('Please plot or draw a shape before exporting.');
      return;
    }

    const btn = document.getElementById('exportBtn');
    btn.innerText = 'Generating Word Doc...';
    btn.disabled = true;

    try {
      const mapElement = document.getElementById('map');
      const canvas = await html2canvas(mapElement, {
        useCORS: true,
        allowTaint: false,
        logging: false,
      });

      const imgData = canvas.toDataURL('image/png');
      const imgBuffer = await fetch(imgData).then((res) => res.arrayBuffer());

      // Safely resolve docx namespace across global browser window objects
      const docxLib = window.docx;
      if (!docxLib || !docxLib.Document) {
        throw new Error('docx library failed to load properly. Please verify internet connection.');
      }

      const { Document, Paragraph, TextRun, ImageRun, Table, TableRow, TableCell, WidthType, Packer } = docxLib;

      const doc = new Document({
        sections: [
          {
            children: [
              new Paragraph({
                children: [
                  new TextRun({ text: 'WKT Shape Export Report', bold: true, size: 32, font: 'Arial' }),
                ],
                spacing: { after: 100 },
              }),
              new Paragraph({
                children: [
                  new TextRun({
                    text: `Generated: ${new Date().toLocaleString()} | OpenStreetMap WKT Playground`,
                    size: 18,
                    color: '6B7280',
                    font: 'Arial',
                  }),
                ],
                spacing: { after: 300 },
              }),
              new Paragraph({
                children: [
                  new TextRun({ text: '1. Map Visualization', bold: true, size: 24, font: 'Arial' }),
                ],
                spacing: { before: 200, after: 150 },
              }),
              new Paragraph({
                children: [
                  new ImageRun({
                    data: imgBuffer,
                    transformation: { width: 550, height: 310 },
                  }),
                ],
                spacing: { after: 300 },
              }),
              new Paragraph({
                children: [
                  new TextRun({ text: '2. Geometry Details', bold: true, size: 24, font: 'Arial' }),
                ],
                spacing: { before: 200, after: 150 },
              }),
              new Table({
                width: { size: 100, type: WidthType.PERCENTAGE },
                rows: [
                  new TableRow({
                    children: [
                      new TableCell({
                        width: { size: 25, type: WidthType.PERCENTAGE },
                        children: [new Paragraph({ children: [new TextRun({ text: 'Label:', bold: true, font: 'Arial' })] })],
                      }),
                      new TableCell({
                        width: { size: 75, type: WidthType.PERCENTAGE },
                        children: [new Paragraph({ children: [new TextRun({ text: label, font: 'Arial' })] })],
                      }),
                    ],
                  }),
                  new TableRow({
                    children: [
                      new TableCell({
                        width: { size: 25, type: WidthType.PERCENTAGE },
                        children: [new Paragraph({ children: [new TextRun({ text: 'WKT String:', bold: true, font: 'Arial' })] })],
                      }),
                      new TableCell({
                        width: { size: 75, type: WidthType.PERCENTAGE },
                        children: [
                          new Paragraph({
                            children: [
                              new TextRun({ text: wkt, font: 'Courier New', size: 18, color: '1E3A8A' }),
                            ],
                          }),
                        ],
                      }),
                    ],
                  }),
                ],
              }),
            ],
          },
        ],
      });

      const blob = await Packer.toBlob(doc);
      saveAs(blob, `${label.toLowerCase().replace(/\s+/g, '-')}.docx`);
    } catch (err) {
      console.error('Word export failed:', err);
      alert('Export failed: ' + err.message);
    } finally {
      btn.innerText = '📄 Export Word Document';
      btn.disabled = false;
    }
  }

  // Initial render
  renderSavedList();
</script>
</body>
</html>
